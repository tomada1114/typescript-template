name: Security audit

on:
  schedule:
    # Weekly. An advisory published after a PR merged is found here, not by the
    # PR-time dependency review.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A manual dispatch queues behind the scheduled run rather than cancelling it.
  cancel-in-progress: false

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only what consumers install. A dev-only advisory is handled by the
      # Dependabot PR, and must not page whoever reads this schedule.
      # `--ignore-registry-errors` keeps a registry outage from reading as a
      # vulnerability; a real advisory still fails the job.
      - name: Audit
        run: pnpm audit --prod --audit-level=moderate --ignore-registry-errors

name: Security audit

on:
  schedule:
    # Weekly. An advisory published after a PR merged is found here, not by the
    # PR-time dependency review.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

# The runner's default `bash -e` hides a failure inside a pipeline and expands
# an unset variable to the empty string. A security check that fails that way
# reports success, so the retry loop below runs under a shell that fails closed.
defaults:
  run:
    shell: "bash --noprofile --norc -eo pipefail -u {0}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A manual dispatch queues behind the scheduled run rather than cancelling it.
  cancel-in-progress: false

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only what consumers install. A dev-only advisory is handled by the
      # Dependabot PR, and must not page whoever reads this schedule. Registry
      # failures are retried briefly and then fail closed: an unavailable audit
      # service must never produce a green security result.
      - name: Audit
        run: |
          for attempt in 1 2 3; do
            pnpm audit --prod --audit-level=moderate && exit 0
            if [ "${attempt}" -lt 3 ]; then
              echo "Audit attempt ${attempt} failed; retrying in 10 seconds."
              sleep 10
            fi
          done
          echo "::error::Production dependency audit failed after 3 attempts."
          exit 1

  secret-scan:
    name: Scan history for leaked credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole point of this job is to catch what predates the
          # staged-content pre-commit check — a shallow checkout would only
          # ever see the latest commit, which `scripts/check-staged.mjs`
          # already covers on every commit going forward.
          fetch-depth: 0

      # `scripts/lib/guard/credentials.mjs` covers the staged diff at commit
      # time; this job covers everything that landed before that check
      # existed, or before a pattern was added. On workflow_dispatch/schedule
      # (this job's only triggers) the action scans the full history of the
      # checked-out ref rather than a commit range.
      - name: Scan git history for secrets
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.1

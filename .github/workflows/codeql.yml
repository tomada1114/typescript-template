name: CodeQL

on:
  push:
    branches: [main]
  # No branch filter here on purpose: a stacked pull request that targets a
  # feature branch is code that will reach main, and skipping it would leave
  # the analysis silently unrun until the final merge.
  pull_request:
  schedule:
    # Weekly, so a newly published query still finds an unmaintained branch.
    - cron: "0 4 * * 1"

permissions: {}

concurrency:
  # Superseding a pull request cancels its previous analysis. A push to main is
  # keyed by commit instead, so consecutive merges neither cancel one another
  # nor leave a merged commit without a CodeQL record.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # to upload the analysis results to the security tab
      contents: read # to check out the code being analysed
      actions: read # for CodeQL to read this workflow's own run metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          # This package is analysed from source; no dependency install or
          # compile step is needed, and skipping it keeps untrusted fork code
          # from executing in a job that holds security-events write.
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:javascript-typescript

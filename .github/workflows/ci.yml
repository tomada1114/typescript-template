name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing is inherited: every job below re-declares the scopes it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # pnpm comes from pnpm/action-setup with an explicit version rather than
      # from Corepack. Corepack's shim reads `devEngines.packageManager`, but it
      # rejects a range: `pnpm@^11.18.0` fails with "expected a semver version".
      # Package scripts also call `pnpm pack` directly, so pnpm has to be on
      # PATH — `corepack pnpm@<version> …` only covers the outermost call.
      # Keep this version in sync with `devEngines.packageManager`;
      # tests/workflows.test.ts fails if it drifts out of the declared range.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Check the API report
        run: pnpm run api:check

      - name: Build the documentation
        run: pnpm run docs:build

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum supported runtime (package.json `engines.node`).
          - node: "22.14.0"
            minimum: true
          # The development default (.node-version).
          - node: "24"
            minimum: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Install dependencies
        if: ${{ !matrix.minimum }}
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: ${{ !matrix.minimum }}
        run: pnpm run test

      # The two steps below are the minimum-Node leg. They repeat the commands
      # above with one flag added rather than interpolating it, so the command
      # a reader sees is the command that runs.
      #
      # `devEngines.runtime` pins development to Node ^24 with `onFail: error`,
      # so pnpm refuses to run at all on the minimum supported runtime. Opting
      # out here is what makes the `engines.node` floor testable: removing the
      # flag does not make CI stricter, it breaks the job. See
      # docs/template-implementation/decisions.md §3.
      - name: Install dependencies (minimum Node)
        if: ${{ matrix.minimum }}
        run: pnpm --config.runtime-on-fail=ignore install --frozen-lockfile

      # This leg is the single source of coverage: spec 02 §5.2 forbids
      # collecting it more than once across the matrix.
      - name: Run tests with coverage (minimum Node)
        if: ${{ matrix.minimum }}
        run: pnpm --config.runtime-on-fail=ignore run test:coverage

  package:
    name: Package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # publint, Are the Types Wrong?, and the tarball allowlist/size checks.
      - name: Lint the publishable package
        run: pnpm run package:lint

  platform-smoke:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Windows runners default to pwsh; one shell keeps the smoke command
        # identical on all three platforms.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Packs the tarball and installs it into a throwaway consumer that
      # imports the package and runs the CLI. No coverage is collected here.
      - name: Smoke test the packed tarball
        run: pnpm run package:smoke

  workflow-security:
    name: Workflow security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor audits these workflows for the failure modes this file is
      # written to avoid: unpinned actions, over-broad permissions, credential
      # persistence, and template injection. Exceptions live in
      # .github/zizmor.yml with a stated reason.
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: 1.28.0
          # Findings are the job's output; uploading SARIF would need
          # security-events write, which this job has no other reason to hold.
          advanced-security: false

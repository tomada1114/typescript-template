name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.18.0

      - name: Require npm with trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Verify tag matches package version
        run: |
          VERSION="$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.version)')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}."
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the full package gate
        run: pnpm check

      - name: Pack the release artifact once
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          TARBALL="$(find dist -maxdepth 1 -name '*.tgz' -type f)"
          test "$(printf '%s\n' "${TARBALL}" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"
          mv "${TARBALL}" dist/package.tgz

      - name: Smoke test the exact release artifact
        run: node scripts/smoke-package.mjs --tarball dist/package.tgz

      - name: Check whether this version is already published
        id: registry
        run: |
          PACKAGE="$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.name)')"
          VERSION="$(node --input-type=module -e 'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.version)')"
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish with npm trusted publishing and provenance
        if: steps.registry.outputs.published != 'true'
        run: npm publish dist/package.tgz --access public --provenance

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: dist/package.tgz
          if-no-files-found: error

  github-release:
    name: Attach the published artifact
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: dist

      - name: Create or repair the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/package.tgz --clobber

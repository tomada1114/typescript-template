# Local Git hooks.
#
# Every job runs a package script, or the very executable and flags that a
# package script runs, so the same change can never pass here and fail
# `pnpm check:quick` or CI. Nothing in this file defines a rule of its own:
# ESLint's config, Prettier's config and `package.json` stay the single sources
# of truth, and this file only narrows *what* they look at.
#
# Install with `pnpm hooks:install`.

pre-commit:
  parallel: true
  # A merge or rebase replays commits that already passed these checks.
  skip:
    - merge
    - rebase
  jobs:
    # Same flags as `pnpm run lint`, narrowed to the files being committed.
    # `--no-warn-ignored` keeps a generated file that happens to be staged from
    # failing the run on a warning about being out of scope.
    - name: eslint
      glob: "*.{ts,mts,cts,js,mjs,cjs}"
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}

    # Same check as `pnpm run format:check`. Formatting is not applied here:
    # a hook that rewrites files mid-commit hides what was actually committed.
    # Run `pnpm fix` when this fails.
    - name: prettier
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

    # Type-checks the whole program, not only the staged files — a change in
    # one file routinely breaks a type in another that this commit does not
    # touch. Cheap enough (~2s) to run on every commit that touches code.
    - name: typecheck
      glob: "*.{ts,mts,cts,js,mjs,cjs}"
      run: pnpm run typecheck

    # Only the test files reachable from the staged files' module graph, not
    # the whole suite — `pnpm run check:quick` (pre-push, below) is where the
    # full suite runs. No glob: unlike eslint/typecheck this needs to see
    # every staged path itself to decide what is related, including a staged
    # test file with no production-code counterpart.
    - name: test:related
      run: pnpm run test:related {staged_files}

    # Content-based checks git itself can see: a credential in a staged file,
    # a quality gate stripped out of a gate file, a staged deletion of one, an
    # .env*/secrets/** file about to be committed. No glob: this is the layer
    # that must see every staged file, whatever its extension — see
    # scripts/check-staged.mjs's header for what it does and does not cover,
    # and how it differs from the shared agent guard hook.
    - name: check:staged
      run: pnpm run check:staged

pre-push:
  skip:
    - merge
    - rebase
  jobs:
    # The full quick gate, unabridged, because a push is the last local moment
    # before CI runs exactly this.
    - name: check:quick
      run: pnpm run check:quick
